[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molagent-llm-core"
version = "0.1.0"
description = "LLM-driven molecular design orchestrator with configurable backends and experiment recording"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["evaluator", "reflection-rag"]

[tool.setuptools.packages.find]
where = ["src"]
