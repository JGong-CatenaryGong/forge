[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-llm-core-spectra"
version = "0.1.0"
description = "LLM-driven molecular design for targeted absorption spectrum color (CIE 1931)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
