[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molagent-llm-core-simple"
version = "0.1.0"
description = "Simple LLM-driven molecular design orchestrator — XTB only, no DFT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
