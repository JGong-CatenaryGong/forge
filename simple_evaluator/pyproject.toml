[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molagent-simple-evaluator"
version = "0.1.0"
description = "Simple XTB-only molecular property evaluator — no DFT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "rdkit>=2023.03",
]

[tool.setuptools.packages.find]
where = ["src"]
